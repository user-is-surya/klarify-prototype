<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Klarify</title>
<style>
  :root{
    --bg:#111111; --fg:#f4f1ec; --muted:#9a948c; --card:#1c1c1c; --line:#2c2c2c;
    --urgent:#d32f2f; --important:#f9a825; --info:#1976d2; --accent:#d94a20; --teal:#107c78;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       -webkit-text-size-adjust:100%}
  body.urgent{background:var(--urgent);color:#fff}
  body.important{background:var(--important);color:#1a1a1a}
  body.info{background:var(--info);color:#fff}
  body.urgent .hero{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{filter:brightness(1.25)}}
  @media (prefers-reduced-motion:reduce){body.urgent .hero{animation:none}}
  header{display:flex;align-items:center;gap:10px;padding:max(12px,env(safe-area-inset-top)) 16px 8px}
  .brand{font:700 20px Georgia,"Times New Roman",serif;letter-spacing:.2px}
  .badge{margin-left:auto;font:600 12px ui-monospace,Consolas,monospace;padding:4px 8px;border:1px solid currentColor;
         border-radius:999px;opacity:.85;white-space:nowrap}
  .dot{width:10px;height:10px;border-radius:50%;background:#3ddc84;flex:none}
  .dot.off{background:#888}
  .banner{display:none;margin:0 16px 8px;padding:10px 12px;border-radius:10px;font-weight:600}
  .banner.show{display:block}
  #b-recon{background:#000;color:#fff;border:2px solid #fff}
  #b-idle{background:rgba(0,0,0,.35);color:#fff}
  .hero{margin:8px 16px;min-height:46vh;border-radius:20px;display:flex;flex-direction:column;align-items:center;
        justify-content:center;text-align:center;padding:24px 16px;gap:6px}
  .icon{font-size:88px;line-height:1}
  .name{font:800 clamp(28px,9vw,52px)/1.05 system-ui,sans-serif;overflow-wrap:anywhere}
  .hint{font-size:20px;font-weight:600;opacity:.95}
  .chip{display:inline-block;margin-top:6px;padding:4px 14px;border-radius:999px;font:800 14px system-ui;letter-spacing:1.5px;
        background:rgba(0,0,0,.28);color:inherit}
  body.important .chip{background:rgba(0,0,0,.18)}
  .ago{font-size:15px;opacity:.85}
  .listening .icon{opacity:.5}
  .listening .name{font-size:30px;font-weight:700;color:var(--muted)}
  section{margin:14px 16px}
  h2{margin:0 0 8px;font:700 13px ui-monospace,Consolas,monospace;letter-spacing:2px;text-transform:uppercase;opacity:.75}
  ul{list-style:none;margin:0;padding:0;background:rgba(0,0,0,.28);border-radius:14px}
  li{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
  li:last-child{border:0}
  .sw{width:12px;height:12px;border-radius:50%;flex:none}
  .sw.urgent{background:var(--urgent);box-shadow:0 0 0 2px #fff4}
  .sw.important{background:var(--important)} .sw.info{background:var(--info);box-shadow:0 0 0 2px #fff4}
  li .t{margin-left:auto;font-size:13px;opacity:.75;white-space:nowrap}
  li.m .n{text-decoration:line-through;opacity:.7}
  .empty{padding:14px;opacity:.7}
  .tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;min-height:48px}
  .tog input{width:26px;height:26px;accent-color:var(--accent)}
  button{font:700 16px system-ui;min-height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--accent);color:#fff;width:100%}
  #vib{display:none;margin:0 16px 8px;width:calc(100% - 32px)}
  footer{padding:8px 16px 24px;font-size:12px;opacity:.6}
</style>
</head>
<body class="idle">
<header>
  <span class="dot off" id="dot" aria-hidden="true"></span>
  <span class="brand">Klarify</span>
  <span class="badge" title="Sounds are generated by a laptop, not heard by a microphone">Simulated input</span>
</header>

<div class="banner" id="b-recon" role="alert">Reconnecting to the Klarify device&hellip;</div>
<div class="banner" id="b-idle">Input idle &mdash; no sound is being fed to the device.</div>
<button id="vib" type="button">Tap to enable vibration</button>

<main class="hero listening" id="hero" aria-live="assertive">
  <div class="icon" id="icon">&#128066;</div>
  <div class="name" id="name">Listening&hellip;</div>
  <div class="hint" id="hint"></div>
  <div><span class="chip" id="chip" hidden></span></div>
  <div class="ago" id="ago"></div>
</main>

<section>
  <h2>Recent sounds</h2>
  <ul id="hist"><li class="empty">Nothing yet.</li></ul>
</section>

<section>
  <h2>Mute a sound</h2>
  <ul id="mutes"></ul>
</section>

<footer>Klarify prototype &middot; demo uses synthetic sounds &middot; only the sound name leaves the device.</footer>

<script>
(function(){
  var SOUNDS = {
    cooker_whistle:{icon:"🍲",name:"Cooker whistle",hint:"Check the cooker now"},
    doorbell:{icon:"🔔",name:"Doorbell",hint:"Someone is at the door"},
    baby_cry:{icon:"👶",name:"Baby crying",hint:"The baby needs attention"},
    smoke_alarm:{icon:"🚨",name:"Smoke alarm",hint:"Possible fire - check now"},
    microwave_beep:{icon:"⏲️",name:"Microwave beep",hint:"Food is ready"}
  };
  var ORDER = ["cooker_whistle","smoke_alarm","baby_cry","doorbell","microwave_beep"];
  var VIB = {urgent:[600,200,600,200,600], important:[300,150,300], info:[150]};
  var $ = function(id){return document.getElementById(id);};
  var fails = 0, lastSeq = null, fetchedAt = 0, vibOn = false, state = null, busy = false;

  function ago(ms){ ms=Math.max(0,ms); var s=Math.round(ms/1000); return s<2?"just now":(s<60?s+"s ago":Math.round(s/60)+" min ago"); }

  function renderMutes(muted){
    var ul=$("mutes"); ul.innerHTML="";
    ORDER.forEach(function(k){
      var li=document.createElement("li"); li.className="tog";
      var lab=document.createElement("label"); lab.style.cssText="display:flex;align-items:center;gap:10px;width:100%;justify-content:space-between";
      var sp=document.createElement("span"); sp.textContent=SOUNDS[k].icon+"  "+SOUNDS[k].name;
      var cb=document.createElement("input"); cb.type="checkbox"; cb.checked=muted.indexOf(k)>=0;
      cb.setAttribute("aria-label","Mute "+SOUNDS[k].name);
      cb.onchange=function(){ fetch("/api/mute?sound="+k+"&on="+(cb.checked?1:0),{method:"POST"}).catch(function(){}); };
      lab.appendChild(sp); lab.appendChild(cb); li.appendChild(lab); ul.appendChild(li);
    });
  }

  function render(){
    var s=state; if(!s) return;
    var elapsed=Date.now()-fetchedAt;
    $("dot").className="dot"+(fails>=2||!s.connected?" off":"");
    $("b-recon").className="banner"+(fails>=2?" show":"");
    $("b-idle").className="banner"+(fails<2&&!s.connected?" show":"");
    var cur=s.current, hero=$("hero");
    if(cur){
      var meta=SOUNDS[cur.sound]||{icon:"🔊",name:cur.label,hint:""};
      document.body.className=cur.level; hero.className="hero";
      $("icon").textContent=meta.icon; $("name").textContent=cur.label; $("hint").textContent=meta.hint;
      $("chip").hidden=false; $("chip").textContent=cur.level.toUpperCase();
      $("ago").textContent=ago(cur.age_ms+elapsed);
    } else {
      document.body.className="idle"; hero.className="hero listening";
      $("icon").textContent="👂"; $("name").textContent="Listening…"; $("hint").textContent="";
      $("chip").hidden=true; $("ago").textContent="";
    }
    var ul=$("hist");
    if(!s.history.length){ ul.innerHTML='<li class="empty">Nothing yet.</li>'; }
    else{
      ul.innerHTML="";
      s.history.forEach(function(h){
        var m=SOUNDS[h.sound]||{icon:"",name:h.sound};
        var li=document.createElement("li"); if(h.muted) li.className="m";
        var sw=document.createElement("span"); sw.className="sw "+h.level;
        var n=document.createElement("span"); n.className="n"; n.textContent=m.icon+" "+m.name+(h.muted?" (muted)":"");
        var t=document.createElement("span"); t.className="t"; t.textContent=ago(s.uptime_ms-h.t_ms+elapsed);
        li.appendChild(sw); li.appendChild(n); li.appendChild(t); ul.appendChild(li);
      });
    }
  }

  function onState(s){
    fails=0; state=s; fetchedAt=Date.now();
    if(lastSeq===null){ lastSeq=s.seq; renderMutes(s.muted); }
    else if(s.seq!==lastSeq){
      lastSeq=s.seq;
      if(vibOn && navigator.vibrate && s.current) navigator.vibrate(VIB[s.current.level]||[150]);
    }
    var cbs=$("mutes").querySelectorAll("input");
    ORDER.forEach(function(k,i){ if(cbs[i] && document.activeElement!==cbs[i]) cbs[i].checked=s.muted.indexOf(k)>=0; });
    render();
  }

  function poll(){
    if(busy) return; busy=true;
    var ctl=("AbortController" in window)?new AbortController():null;
    var to=setTimeout(function(){ if(ctl) ctl.abort(); },1500);
    fetch("/api/state",{cache:"no-store",signal:ctl?ctl.signal:undefined})
      .then(function(r){ if(!r.ok) throw new Error("bad"); return r.json(); })
      .then(onState)
      .catch(function(){ fails++; render(); if(!state){ $("b-recon").className="banner show"; } })
      .then(function(){ clearTimeout(to); busy=false; });
  }

  if(navigator.vibrate){
    var b=$("vib"); b.style.display="block";
    b.onclick=function(){ vibOn=true; navigator.vibrate(60); b.style.display="none"; };
  }
  renderMutes([]);
  setInterval(poll,300); setInterval(render,1000); poll();
})();
</script>
</body>
</html>
