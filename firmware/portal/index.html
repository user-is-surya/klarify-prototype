<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1A20" id="theme">
<title>Klarify</title>
<style>
  :root{
    --ink:#0B1A20; --ink2:#12262E; --line:#25414B; --text:#EAF2F1; --muted:#93AEB3; --live:#19C3B1;
    --urgent:#CC1533; --important:#FFB000; --info:#1A5FD0; --brand:#D94A20;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100vh;min-height:100svh;background:var(--lamp,var(--ink));color:var(--on,var(--text));
       font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  body.lv-urgent{--lamp:var(--urgent);--on:#fff;--soft:rgba(0,0,0,.26)}
  body.lv-important{--lamp:var(--important);--on:#1A1200;--soft:rgba(0,0,0,.12)}
  body.lv-info{--lamp:var(--info);--on:#fff;--soft:rgba(0,0,0,.24)}
  body:not([class*="lv-"]){--soft:var(--ink2)}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px max(28px,env(safe-area-inset-bottom))}
  :focus-visible{outline:3px solid currentColor;outline-offset:3px;border-radius:6px}

  .bar{display:flex;align-items:center;gap:12px;padding:max(14px,env(safe-area-inset-top)) 0 10px}
  .mark{font-weight:800;font-size:1.3rem;letter-spacing:-.03em}
  body:not([class*="lv-"]) .mark b{color:var(--brand)}
  .live{display:flex;align-items:center;gap:7px;font-size:.9rem}
  .live .d{width:10px;height:10px;border-radius:50%;background:var(--live);flex:none}
  .live .d.off{background:transparent;border:2px solid currentColor}
  .sim{margin-left:auto;font-size:.8125rem;font-weight:600;border:1.5px solid currentColor;border-radius:999px;padding:3px 11px;white-space:nowrap}

  .note{display:none;margin:4px 0 0;padding:11px 14px;border-radius:12px;background:var(--soft);font-weight:600}
  .note.show{display:block}
  #vib{display:none;margin:10px 0 0;min-height:48px;width:100%;border:2px solid currentColor;border-radius:14px;
       background:transparent;color:inherit;font-family:inherit;font-weight:700;font-size:1rem}

  .hero{min-height:min(60vh,540px);min-height:min(60svh,540px);display:flex;flex-direction:column;justify-content:center;gap:16px;padding:14px 0 28px}
  .ribbon{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;height:12px}
  .ribbon i{border-radius:4px;background:currentColor;opacity:.2}
  .lv-urgent .ribbon i{opacity:1}
  .lv-important .ribbon i:nth-child(1),.lv-important .ribbon i:nth-child(2),
  .lv-important .ribbon i:nth-child(4),.lv-important .ribbon i:nth-child(5){opacity:1}
  .lv-info .ribbon i:nth-child(1){opacity:1}
  body:not([class*="lv-"]) .ribbon{visibility:hidden}
  .lv-urgent .ribbon{animation:beat 1s ease-in-out infinite}
  @keyframes beat{50%{opacity:.35}}

  .art{height:clamp(96px,30vw,150px)}
  .pic{height:100%;width:auto;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .rings circle{animation:breathe 3.6s ease-in-out infinite;transform-origin:32px 32px}
  .rings circle:nth-child(2){animation-delay:.5s}
  .rings circle:nth-child(3){animation-delay:1s}
  @keyframes breathe{0%,100%{opacity:.25}50%{opacity:1}}

  .name{margin:0;font-size:clamp(2.6rem,14vw,4.6rem);line-height:.95;font-weight:800;letter-spacing:-.04em;overflow-wrap:anywhere}
  body:not([class*="lv-"]) .name{font-size:clamp(2rem,10vw,3rem);letter-spacing:-.03em}
  .hint{margin:0;font-size:1.3rem;line-height:1.3;font-weight:600}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;min-height:36px}
  .pill{display:none;align-items:center;gap:8px;padding:6px 15px 6px 9px;border-radius:999px;background:var(--soft);font-weight:700}
  .pill.show{display:inline-flex}
  .pill svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .age{font-size:.95rem}

  section{margin:22px 0 0}
  h2{margin:0 0 10px;font-size:1.05rem;font-weight:700}
  .list{margin:0;padding:0;list-style:none;background:var(--soft);border-radius:16px;overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px}
  .row + .row{border-top:1px solid rgba(127,127,127,.28)}
  .row .g{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .row .t{margin-left:auto;font-size:.875rem;white-space:nowrap}
  .row.m .n{text-decoration:line-through}
  .row .n small,.row .lab small{display:block;font-size:.8125rem;opacity:.85}
  .empty{padding:16px;opacity:.85}
  .mini{width:34px;height:34px;flex:none;fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
  .lab{flex:1;min-width:0;font-weight:600}
  .sw{flex:none;position:relative;width:56px;height:32px;border-radius:999px;border:2px solid currentColor;background:transparent;color:inherit;padding:0;cursor:pointer}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:currentColor}
  .sw[aria-checked="true"]{background:currentColor}
  .sw[aria-checked="true"]::after{left:27px;background:var(--lamp,var(--ink))}
  .sw::before{content:"";position:absolute;inset:-10px -4px}

  footer{margin-top:26px;font-size:.8125rem;line-height:1.5;opacity:.85}
  footer a{color:inherit;font-weight:700}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  #toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(92vw,420px);
         background:#000;color:#fff;border:2px solid #fff;border-radius:14px;padding:12px 16px;font-weight:600;display:none;z-index:9}
  #toast.show{display:block}
  @media (prefers-reduced-motion:reduce){.lv-urgent .ribbon,.rings circle{animation:none}.rings circle{opacity:.8}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <span class="mark">Klarif<b>y</b></span>
    <span class="live"><span class="d off" id="dot" aria-hidden="true"></span><span id="liveTxt">Connecting</span></span>
    <span class="sim" title="Sounds are generated by a laptop, not heard by a microphone">Simulated input</span>
  </header>

  <div class="note" id="note" role="status"></div>
  <button id="vib" type="button">Turn on vibration alerts</button>

  <main class="hero" id="hero">
    <div class="ribbon" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="art" id="art" aria-hidden="true"></div>
    <h1 class="name" id="name">Connecting</h1>
    <p class="hint" id="hint"></p>
    <div class="meta"><span class="pill" id="pill"></span><span class="age" id="age"></span></div>
  </main>
  <div class="sr" id="announce" aria-live="assertive"></div>

  <section aria-labelledby="h-hist">
    <h2 id="h-hist">Recent sounds</h2>
    <ul class="list" id="hist"><li class="empty">Nothing yet.</li></ul>
  </section>

  <section aria-labelledby="h-mute">
    <h2 id="h-mute">Choose which sounds alert you</h2>
    <ul class="list" id="mutes"></ul>
  </section>

  <footer>
    <span id="ver">Firmware</span> &middot; <a href="/update">Update</a><br>
    This demo plays synthetic sounds. Only the name of a sound leaves the board, never audio.
  </footer>
</div>
<div id="toast" role="status"></div>

<script>
(function(){
  "use strict";

  /* ---- icons: drawn on a 64x64 grid, stroke only ---- */
  var ICON = {
    cooker_whistle:'<path d="M10 30h44v18a6 6 0 0 1-6 6H16a6 6 0 0 1-6-6z"/><path d="M14 30c0-9 8-14 18-14s18 5 18 14"/><path d="M54 36h6v8h-6"/><path d="M28 16v-5h8v5"/><path d="M26 8c-2-2 2-3 0-6M38 8c-2-2 2-3 0-6"/>',
    doorbell:'<path d="M32 9c-9 0-15 7-15 16v9l-5 9h40l-5-9V25c0-9-6-16-15-16z"/><path d="M26 50a6 6 0 0 0 12 0"/><path d="M32 9V5"/><path d="M7 22c-2 4-2 8 0 12M57 22c2 4 2 8 0 12"/>',
    baby_cry:'<circle cx="32" cy="34" r="20"/><path d="M21 30q4 4 8 0M35 30q4 4 8 0"/><ellipse cx="32" cy="45" rx="5" ry="6"/><path d="M19 37v7M45 37v7"/><path d="M32 14c-2-5 6-6 5-1"/>',
    smoke_alarm:'<circle cx="32" cy="38" r="20"/><circle cx="32" cy="38" r="9"/><path d="M32 38v.01" stroke-width="6"/><path d="M11 16l-5-4M32 12V4M53 16l5-4"/>',
    microwave_beep:'<rect x="6" y="14" width="52" height="34" rx="5"/><rect x="12" y="20" width="30" height="22" rx="2"/><path d="M50 23v.01M50 31v.01M50 39v.01" stroke-width="5"/><path d="M14 54h8M42 54h8"/>'
  };
  var RINGS='<g class="rings"><circle cx="32" cy="32" r="7"/><circle cx="32" cy="32" r="16"/><circle cx="32" cy="32" r="25"/></g>';
  var LOST='<path d="M7 26c14-13 36-13 50 0M16 35c9-8 23-8 32 0M25 44c4-3 10-3 14 0"/><path d="M32 53v.01" stroke-width="5"/><path d="M9 56L55 8"/>';
  var GLYPH = {  /* 24x24: shape + mark, so level never depends on colour alone */
    urgent:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3L22 20H2z"/><path d="M12 9v5M12 17v.01"/></svg>',
    important:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l10 10-10 10L2 12z"/><path d="M12 8v5M12 16v.01"/></svg>',
    info:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5v.01"/></svg>'
  };
  var SOUNDS = {
    cooker_whistle:{name:"Cooker whistle",hint:"Check the cooker now",level:"urgent"},
    smoke_alarm:{name:"Smoke alarm",hint:"Possible fire. Check now",level:"urgent"},
    baby_cry:{name:"Baby crying",hint:"The baby needs attention",level:"important"},
    doorbell:{name:"Doorbell",hint:"Someone is at the door",level:"info"},
    microwave_beep:{name:"Microwave beep",hint:"Food is ready",level:"info"}
  };
  var ORDER = ["cooker_whistle","smoke_alarm","baby_cry","doorbell","microwave_beep"];
  var WORD = {urgent:"Urgent",important:"Important",info:"Info"};
  var THEME = {urgent:"#CC1533",important:"#FFB000",info:"#1A5FD0",none:"#0B1A20"};
  var VIB = {urgent:[600,200,600,200,600], important:[300,150,300], info:[150]};

  var $ = function(id){ return document.getElementById(id); };
  var fails = 0, lastSeq = null, fetchedAt = 0, vibOn = false, state = null, busy = false;
  var shownArt = "", verShown = false, pending = {}, toastTimer = null;

  // BEGIN heroMode
  // What the big panel shows. "lost" = two failed polls in a row (board off / phone left the Wi-Fi):
  // never keep showing the last alert as if it were current.
  function heroMode(s, fails){
    if (fails >= 2) return "lost";
    if (!s) return "idle";
    return s.current ? "alert" : "idle";
  }
  // END heroMode

  function ago(ms){ ms=Math.max(0,ms); var s=Math.round(ms/1000); return s<2?"just now":(s<60?s+" s ago":Math.round(s/60)+" min ago"); }
  function svg(inner, cls){ return '<svg class="'+cls+'" viewBox="0 0 64 64" aria-hidden="true">'+inner+'</svg>'; }
  function toast(msg){
    var t=$("toast"); t.textContent=msg; t.className="show";
    clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.className=""; },3500);
  }
  function setArt(key, inner){ if(shownArt!==key){ shownArt=key; $("art").innerHTML=svg(inner,"pic"); } }

  function buildMutes(){
    var ul=$("mutes"); ul.innerHTML="";
    ORDER.forEach(function(k){
      var m=SOUNDS[k], li=document.createElement("li"); li.className="row";
      li.innerHTML=svg(ICON[k],"mini");
      var lab=document.createElement("span"); lab.className="lab"; lab.id="lab-"+k;
      lab.appendChild(document.createTextNode(m.name));
      var sm=document.createElement("small"); sm.textContent=WORD[m.level]; lab.appendChild(sm);
      var b=document.createElement("button"); b.type="button"; b.className="sw"; b.setAttribute("role","switch");
      b.setAttribute("aria-checked","false"); b.setAttribute("aria-labelledby","lab-"+k); b.id="sw-"+k;
      b.onclick=function(){ toggle(k,b); };
      li.appendChild(lab); li.appendChild(b); ul.appendChild(li);
    });
  }
  function setSw(b,on){ b.setAttribute("aria-checked", on?"true":"false"); }
  // A switch that is ON means "muted". Optimistic, and put back if the board does not confirm.
  function toggle(k,b){
    var want=b.getAttribute("aria-checked")!=="true"; setSw(b,want); pending[k]=true;
    fetch("/api/mute?sound="+k+"&on="+(want?1:0),{method:"POST"})
      .then(function(r){ if(!r.ok) throw new Error("bad"); })
      .catch(function(){ setSw(b,!want); toast("Could not change that. Check the connection and try again."); })
      .then(function(){ delete pending[k]; });
  }

  function render(){
    var s=state;
    if(!s){ return; }
    var mode=heroMode(s,fails), elapsed=Date.now()-fetchedAt, cur=s.current, level="none";
    var live = fails<2 && s.connected;
    $("dot").className="d"+(live?"":" off");
    $("liveTxt").textContent = fails>=2 ? "Offline" : (s.connected ? "Listening" : "Feeder off");
    var note=$("note");
    if(fails<2 && !s.connected){ note.textContent="No sounds are being fed to the board. Start klarify-feeder on the laptop."; note.className="note show"; }
    else { note.className="note"; }

    var pill=$("pill");
    if(mode==="alert"){
      var m=SOUNDS[cur.sound]||{name:cur.label,hint:"",level:cur.level};
      level=cur.level;
      setArt(cur.sound, ICON[cur.sound]||ICON.doorbell);
      $("name").textContent=cur.label; $("hint").textContent=m.hint;
      pill.innerHTML=GLYPH[level]+'<span>'+WORD[level]+'</span>'; pill.className="pill show";
      $("age").textContent=ago(cur.age_ms+elapsed);
    } else if(mode==="lost"){
      setArt("lost", LOST);
      $("name").textContent="No signal"; $("hint").textContent="Check the board has power and this phone is on the Klarify-Demo Wi-Fi.";
      pill.className="pill"; $("age").textContent="";
    } else {
      setArt("idle", RINGS);
      $("name").textContent="Listening"; pill.className="pill"; $("age").textContent="";
      var last=null; for(var i=0;i<s.history.length;i++){ if(!s.history[i].muted){ last=s.history[i]; break; } }
      $("hint").textContent = last ? ("Last heard: "+((SOUNDS[last.sound]||{}).name||last.sound)+", "+ago(s.uptime_ms-last.t_ms+elapsed)+".") : "Nothing to report.";
    }
    document.body.className = level==="none" ? "" : "lv-"+level;
    $("theme").setAttribute("content", THEME[level]);
    document.title = mode==="alert" ? cur.label+" - Klarify" : "Klarify";

    var ul=$("hist");
    if(!s.history.length){ ul.innerHTML='<li class="empty">Nothing yet.</li>'; }
    else{
      ul.innerHTML="";
      s.history.forEach(function(h){
        var m=SOUNDS[h.sound]||{name:h.sound}, li=document.createElement("li");
        li.className="row"+(h.muted?" m":"");
        li.innerHTML=GLYPH[h.level]||"";
        var g=li.firstChild; if(g) g.setAttribute("class","g");
        var n=document.createElement("span"); n.className="n"; n.textContent=m.name;
        if(h.muted){ var sm=document.createElement("small"); sm.textContent="Muted, no alert"; n.appendChild(sm); }
        var t=document.createElement("span"); t.className="t"; t.textContent=ago(s.uptime_ms-h.t_ms+elapsed);
        li.appendChild(n); li.appendChild(t); ul.appendChild(li);
      });
    }
  }

  function onState(s){
    var rebooted = state && s.uptime_ms < state.uptime_ms;
    fails=0; state=s; fetchedAt=Date.now();
    if(lastSeq===null || rebooted){ lastSeq=s.seq; }
    else if(s.seq!==lastSeq){
      lastSeq=s.seq;
      if(s.current){
        var m=SOUNDS[s.current.sound]||{hint:""};
        $("announce").textContent=(WORD[s.current.level]||"")+": "+s.current.label+". "+m.hint;
        if(vibOn && navigator.vibrate) navigator.vibrate(VIB[s.current.level]||[150]);
      }
    }
    ORDER.forEach(function(k){ var b=$("sw-"+k); if(b && !pending[k]) setSw(b, s.muted.indexOf(k)>=0); });
    if(!verShown) loadVersion();
    render();
  }

  function loadVersion(){
    fetch("/api/version",{cache:"no-store"}).then(function(r){ return r.json(); })
      .then(function(v){ $("ver").textContent="Firmware "+v.version; verShown=true; }).catch(function(){});
  }

  function poll(){
    if(busy) return; busy=true;
    var ctl=("AbortController" in window)?new AbortController():null;
    var to=setTimeout(function(){ if(ctl) ctl.abort(); },1500);
    fetch("/api/state",{cache:"no-store",signal:ctl?ctl.signal:undefined})
      .then(function(r){ if(!r.ok) throw new Error("bad"); return r.json(); })
      .then(onState)
      .catch(function(){
        fails++;
        if(!state){ if(fails>=2){ state={connected:false,current:null,history:[],muted:[],uptime_ms:0,seq:0}; } }
        render();
      })
      .then(function(){ clearTimeout(to); busy=false; });
  }

  buildMutes();
  setArt("idle", RINGS);
  if(navigator.vibrate){
    var b=$("vib"); b.style.display="block";
    b.onclick=function(){ vibOn=true; navigator.vibrate(60); b.style.display="none"; };
  }
  setInterval(poll,300); setInterval(render,1000); poll();
})();
</script>
</body>
</html>
